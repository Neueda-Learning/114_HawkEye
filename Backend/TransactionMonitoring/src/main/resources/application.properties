spring.application.name=TransactionMonitoring
server.port=8080

# ===== DATASOURCE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hawkeye_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JACKSON =====
# Note: Spring Boot 4.x uses Jackson 3.x ? write-dates-as-timestamps is not supported
spring.jackson.time-zone=UTC

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
