spring.application.name=TransactionMonitoring
server.port=8080

# ??? MySQL DataSource ??????????????????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? JPA / Hibernate ??????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ??? Swagger / OpenAPI ?????????????????????????????????????????????????????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ??? Actuator ?????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics

# ??? Logging ??????????????????????????????????????????????????????????????????
logging.level.neueda.in=INFO
