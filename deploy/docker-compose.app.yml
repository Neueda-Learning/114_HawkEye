services:
  backend:
    build:
      context: ../Backend/TransactionMonitoring
      dockerfile: Dockerfile
    container_name: hawkeye-backend
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/txnd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-n3u3da!}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hawkeyee2026@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-isluwfnxobbyfupv}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: hawkeye-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"

