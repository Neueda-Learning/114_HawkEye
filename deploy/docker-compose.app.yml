services:
  mysql:
    image: mysql:8.0
    container_name: hawkeye-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-txnd}
      MYSQL_USER: ${MYSQL_USER:-hawkeye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HawkEye@123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: --default-authentication-plugin=caching_sha2_password
    volumes:
      - hawkeye-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../Backend/TransactionMonitoring
      dockerfile: Dockerfile
    container_name: hawkeye-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/txnd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-hawkeye}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-HawkEye@123}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hawkeyee2026@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-isluwfnxobbyfupv}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-true}

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: hawkeye-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  hawkeye-mysql-data:

