name: HawkEye CI

on:
  push:
    branches:
      - main
      - dev
      - integration

  pull_request:
    branches:
      - main
      - dev
      - integration


jobs:

  backend-ci:

    name: Backend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/TransactionMonitoring

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Run backend tests
        run: mvn test


      - name: Build backend
        run: mvn package -DskipTests



  frontend-ci:

    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      - name: Install dependencies
        run: npm install


      - name: Run frontend tests
        run: npm run test -- --run


      - name: Build frontend
        run: npm run build