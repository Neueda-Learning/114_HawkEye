services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hawkeye-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/casc.yaml
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: admin123!ChangeMe
      JENKINS_ADMIN_EMAIL: admin@example.com
      JENKINS_URL: http://localhost:8081/
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
      - ../:/var/jenkins_home/workspace/HawkEyeRepoSeed:ro
    user: root

volumes:
  jenkins_home:



